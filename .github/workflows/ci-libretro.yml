name: CI (libretro)
on: [push, pull_request]
jobs:
  build-libretro:
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
    - name: make
      run: make -j$(getconf _NPROCESSORS_ONLN) -f Makefile.libretro

  build-libretro-win32:
    if: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: true
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y gcc-mingw-w64
    - name: make
      run: make -j$(getconf _NPROCESSORS_ONLN) -f Makefile.libretro platform=win32 CC=x86_64-w64-mingw32-gcc

  build-libretro-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Set up Android NDK r23
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r23
    - name: ndk-build
      run: |
        ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build -j$(getconf _NPROCESSORS_ONLN) --no-print-directory -C jni/ \
          APP_ABI=armeabi-v7a \
          V7NEONOPTIMIZATION=1
    - name: Upload core artifact
      uses: actions/upload-artifact@v7
      with:
        name: pcsx_rearmed_libretro_android
        path: libs/armeabi-v7a/pcsx_rearmed_libretro_android.so
        retention-days: 30
